# theme: jekyll-theme-minima
theme: jekyll-theme-minima
title: "Your Site Title"
description: "Short description of your site"
url: "https://example.com"      # the full site URL, no trailing slash
baseurl: ""                    # set to "/repo-name" if hosted at username.github.io/repo-name
lang: "en"
author:
  name: "Your Name"
  email: "you@example.com"

# Exclude files from the site build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Useful plugins (if you build with GitHub Actions or local Jekyll, not allowed on Pages' default build unless using github-pages)
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Markdown / kramdown settings (common and compatible)
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Permalinks (optional)
permalink: /:categories/:year/:month/:day/:title/

# Minima-specific override example (if you create assets/css/style.scss)
# To override Minima's styles, create assets/css/style.scss with front matter:
# ---
# ---
# @import "minima";
#
# then add your custom rules below the import.
