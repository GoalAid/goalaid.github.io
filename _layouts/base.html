<!-- 左侧导航栏 -->
<div class="sidebar">
  <ul class="nav-list">
    {% for nav_item in site.navigation %}
      <li class="nav-item">
        <a href="{{ nav_item.url | relative_url }}">{{ nav_item.text }}</a>
        <!-- 渲染子菜单 -->
        {% if nav_item.sublinks %}
          <ul class="sub-nav-list">
            {% for sub_item in nav_item.sublinks %}
              <li class="sub-nav-item">
                <a href="{{ sub_item.url | relative_url }}">{{ sub_item.text }}</a>
              </li>
            {% endfor %}
          </ul>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</div>
